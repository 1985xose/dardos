<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1b14">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>"><title>Dardos · La Diana de Pako</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1b14;
    --felt:#152a1f;
    --felt2:#1c3527;
    --line:#2c4a38;
    --cream:#f4ecd8;
    --cream-dim:#b8b099;
    --red:#c0392b;
    --red-glow:#e74c3c;
    --green:#2e9e63;
    --gold:#d4a64a;
    --ink:#0a130d;
    --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Oswald',sans-serif;
    background:
      radial-gradient(circle at 50% -10%, rgba(46,158,99,.10), transparent 55%),
      radial-gradient(circle at 85% 110%, rgba(192,57,43,.10), transparent 50%),
      var(--bg);
    color:var(--cream);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* faint dartboard backdrop */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;opacity:.045;pointer-events:none;
    background-image:
      repeating-conic-gradient(from 0deg at 50% 38%, var(--cream) 0deg 9deg, transparent 9deg 18deg);
    mask:radial-gradient(circle at 50% 38%, #000 0, #000 42vmin, transparent 43vmin);
    -webkit-mask:radial-gradient(circle at 50% 38%, #000 0, #000 42vmin, transparent 43vmin);
  }
  .wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:18px 16px 40px;min-height:100vh;display:flex;flex-direction:column}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo-dart{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 2px 4px var(--shadow))}
  .title h1{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.5px;line-height:.95;text-transform:uppercase}
  .title h1 span{color:var(--red-glow)}
  .title p{font-family:'Caveat',cursive;font-size:18px;color:var(--gold);margin-top:-2px}
  .who{margin-left:auto;text-align:right;font-size:12px;color:var(--cream-dim);line-height:1.3}
  .who b{display:block;color:var(--cream);font-weight:600;font-size:13px}
  .who a{color:var(--gold);font-size:11px;text-decoration:none;border-bottom:1px dotted}

  /* ---------- cards / buttons ---------- */
  .card{background:linear-gradient(180deg,var(--felt2),var(--felt));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px var(--shadow);margin-bottom:14px}
  .card h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .btn{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;border:none;border-radius:12px;padding:14px 18px;cursor:pointer;color:var(--cream);background:var(--line);transition:transform .08s,filter .15s;width:100%;text-transform:uppercase}
  .btn:active{transform:scale(.97)}
  .btn-red{background:linear-gradient(180deg,var(--red-glow),var(--red));color:#fff;box-shadow:0 4px 0 #7c241a}
  .btn-red:active{box-shadow:0 1px 0 #7c241a;transform:translateY(3px)}
  .btn-green{background:linear-gradient(180deg,var(--green),#1f6e44);color:#fff;box-shadow:0 4px 0 #134529}
  .btn-green:active{box-shadow:0 1px 0 #134529;transform:translateY(3px)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--cream-dim);font-size:16px;letter-spacing:1px}
  .row{display:flex;gap:10px}
  .hidden{display:none!important}

  /* ---------- login ---------- */
  #loginScreen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
  #loginScreen .big-dart{font-size:64px;filter:drop-shadow(0 4px 10px var(--shadow))}
  #loginScreen h2{font-family:'Anton',sans-serif;font-size:32px;text-transform:uppercase;letter-spacing:1px}
  #loginScreen p{color:var(--cream-dim);max-width:300px;font-size:15px}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#222;border:none;border-radius:12px;padding:13px 22px;font-family:'Oswald';font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 4px 14px var(--shadow)}

  /* ---------- player select ---------- */
  .players-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .pchip{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--felt);border:2px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s}
  .pchip.sel{border-color:var(--gold);background:rgba(212,166,74,.10)}
  .pchip .avatar{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:18px;color:#fff;position:relative;border:2px solid rgba(255,255,255,.25)}
  .pchip .pname{font-weight:600;font-size:16px}
  .pchip .check{margin-left:auto;font-size:18px;color:var(--gold);opacity:0}
  .pchip.sel .check{opacity:1}

  .seg{display:flex;gap:8px;margin:6px 0 14px}
  .seg button{flex:1;font-family:'Bebas Neue';font-size:22px;letter-spacing:1px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--felt);color:var(--cream-dim);cursor:pointer}
  .seg button.on{border-color:var(--red-glow);background:rgba(231,76,60,.12);color:var(--cream)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--line)}
  .toggle-row .lbl{font-size:15px}
  .toggle-row .sub{font-size:12px;color:var(--cream-dim)}
  .switch{position:relative;width:52px;height:30px;flex:0 0 auto}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s;cursor:pointer}
  .slider::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:var(--cream);border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--green)}
  .switch input:checked + .slider::before{transform:translateX(22px)}

  /* ---------- game ---------- */
  #gameScreen .scoreboard{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .pscore{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--felt);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s,background .2s}
  .pscore.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,166,74,.35),0 6px 18px var(--shadow);background:var(--felt2)}
  .pscore .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:18px;color:#fff;border:2px solid rgba(255,255,255,.25)}
  .pscore .info{flex:1;min-width:0}
  .pscore .nm{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
  .pscore .turnpts{font-size:12px;color:var(--cream-dim)}
  .pscore .pts{font-family:'Anton';font-size:38px;line-height:1;color:var(--cream)}
  .pscore.active .pts{color:var(--gold)}
  .pscore .arrow{color:var(--gold);font-size:18px}

  .checkout{background:linear-gradient(180deg,rgba(46,158,99,.16),rgba(46,158,99,.04));border:1px solid var(--green);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center}
  .checkout .ttl{font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;color:var(--green);margin-bottom:8px}
  .checkout .ttl b{color:var(--cream)}
  .routes{display:flex;flex-direction:column;gap:8px}
  .route{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-family:'Bebas Neue';font-size:22px;letter-spacing:1px}
  .hit{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 12px;color:var(--cream)}
  .hit.dbl{border-color:var(--red-glow);color:var(--red-glow)}
  .hit.bull{border-color:var(--green);color:var(--green)}
  .arrow-s{color:var(--cream-dim);font-size:16px}
  .nocheck{color:var(--gold);font-family:'Caveat';font-size:20px}

  /* keypad / input */
  .entry{background:var(--felt2);border:1px solid var(--line);border-radius:16px;padding:14px}
  .entry .display{font-family:'Anton';font-size:46px;text-align:center;color:var(--cream);min-height:54px;letter-spacing:2px}
  .entry .display .ph{color:var(--cream-dim);opacity:.4}
  .entry .turnfor{text-align:center;font-size:13px;color:var(--cream-dim);margin-bottom:6px}
  .entry .turnfor b{color:var(--gold)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .key{font-family:'Bebas Neue';font-size:28px;padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--felt);color:var(--cream);cursor:pointer}
  .key:active{background:var(--line)}
  .key.wide{grid-column:span 1}
  .key-del{color:var(--red-glow)}
  .entry-actions{display:flex;gap:8px;margin-top:10px}
  .entry-actions .btn{flex:1}
  .quick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
  .quick button{font-family:'Bebas Neue';font-size:16px;letter-spacing:.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--felt);color:var(--cream-dim);cursor:pointer}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--red);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:15px;box-shadow:0 6px 20px var(--shadow);opacity:0;transition:.25s;z-index:50;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.good{background:var(--green)}

  /* winner */
  #winScreen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
  #winScreen .crown{font-size:60px}
  #winScreen h2{font-family:'Anton';font-size:30px;text-transform:uppercase}
  #winScreen .wname{color:var(--gold)}
  #winScreen .stat{color:var(--cream-dim);font-size:15px}

  /* history & stats */
  .stat-table{width:100%;border-collapse:collapse;font-size:14px}
  .stat-table th{font-family:'Bebas Neue';letter-spacing:1px;color:var(--cream-dim);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:400}
  .stat-table th:first-child{text-align:left}
  .stat-table td{padding:9px 6px;text-align:right;border-bottom:1px solid rgba(44,74,56,.4)}
  .stat-table td:first-child{text-align:left;display:flex;align-items:center;gap:8px}
  .stat-table .miniav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:12px;color:#fff;flex:0 0 auto}
  .hist-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(44,74,56,.4);font-size:14px}
  .hist-item .mode-tag{font-family:'Bebas Neue';background:var(--line);padding:2px 8px;border-radius:6px;font-size:13px}
  .hist-item .win{color:var(--gold);font-weight:600}
  .hist-item .date{margin-left:auto;color:var(--cream-dim);font-size:12px}
  .empty{text-align:center;color:var(--cream-dim);font-family:'Caveat';font-size:20px;padding:20px}

  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--felt);color:var(--cream-dim);cursor:pointer}
  .tabs button.on{background:var(--line);color:var(--cream)}
  .legend{font-size:11px;color:var(--cream-dim);text-align:center;margin-top:8px}
  .legend b{color:var(--cream)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="logo-dart" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="30" fill="#152a1f" stroke="#2c4a38" stroke-width="2"/>
      <circle cx="32" cy="32" r="22" fill="none" stroke="#c0392b" stroke-width="6" stroke-dasharray="2 4"/>
      <circle cx="32" cy="32" r="13" fill="none" stroke="#2e9e63" stroke-width="5"/>
      <circle cx="32" cy="32" r="5" fill="#c0392b"/>
      <circle cx="32" cy="32" r="2" fill="#d4a64a"/>
    </svg>
    <div class="title">
      <h1>LA <span>DIANA</span></h1>
      <p>de Pako</p>
    </div>
    <div class="who" id="whoBox"></div>
  </header>

  <!-- LOGIN -->
  <section id="loginScreen">
    <div class="big-dart">🎯</div>
    <h2>La Diana de Pako</h2>
    <p>301 · 501 · marcador de la peña. Inicia sesión para llevar el histórico.</p>
    <button class="gbtn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.7 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 13.7 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.7 38 46.5 31.8 46.5 24.5z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.3-5.7c-2 1.4-4.7 2.3-7.7 2.3-6.4 0-11.8-4.2-13.6-10l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Entrar con Google
    </button>
    <div class="legend" id="loginErr"></div>
  </section>

  <!-- NEW GAME -->
  <section id="newGameScreen" class="hidden">
    <div class="card">
      <h2>🎯 Nueva partida</h2>
      <div style="font-size:14px;color:var(--cream-dim);margin-bottom:10px">¿Quién juega? (mín. 2)</div>
      <div class="players-grid" id="playersGrid"></div>
    </div>

    <div class="card">
      <h2>Modo</h2>
      <div class="seg" id="modeSeg">
        <button data-mode="301" class="on">301</button>
        <button data-mode="501">501</button>
      </div>
      <div class="toggle-row">
        <div>
          <div class="lbl">Cierre a doble</div>
          <div class="sub">Hay que cerrar con un doble o la bull (50)</div>
        </div>
        <label class="switch"><input type="checkbox" id="doubleOut"><span class="slider"></span></label>
      </div>
    </div>

    <button class="btn btn-red" id="startBtn">Empezar partida</button>
    <button class="btn btn-ghost" id="goHistoryBtn" style="margin-top:10px">Ver histórico y stats</button>
  </section>

  <!-- GAME -->
  <section id="gameScreen" class="hidden">
    <div class="scoreboard" id="scoreboard"></div>

    <div class="checkout hidden" id="checkoutBox">
      <div class="ttl">Para cerrar te quedan <b id="coRemain">0</b></div>
      <div class="routes" id="routes"></div>
    </div>

    <div class="entry">
      <div class="turnfor">Turno de <b id="turnName">—</b></div>
      <div class="display"><span id="entryVal" class="ph">0</span></div>
      <div class="keypad" id="keypad"></div>
      <div class="quick" id="quickBtns"></div>
      <div class="entry-actions">
        <button class="btn btn-ghost" id="undoBtn">↶ Deshacer</button>
        <button class="btn btn-green" id="okBtn">Anotar</button>
      </div>
    </div>

    <button class="btn btn-ghost" id="quitBtn" style="margin-top:12px">Abandonar partida</button>
  </section>

  <!-- WINNER -->
  <section id="winScreen" class="hidden">
    <div class="crown">👑</div>
    <h2>¡Ganó <span class="wname" id="winName">—</span>!</h2>
    <div class="stat" id="winStat"></div>
    <button class="btn btn-red" id="rematchBtn" style="max-width:280px">Revancha (mismos)</button>
    <button class="btn btn-ghost" id="newFromWinBtn" style="max-width:280px;margin-top:10px">Nueva partida</button>
  </section>

  <!-- HISTORY -->
  <section id="historyScreen" class="hidden">
    <div class="tabs">
      <button id="tabStats" class="on">Clasificación</button>
      <button id="tabHist">Partidas</button>
    </div>
    <div class="card" id="statsCard">
      <table class="stat-table">
        <thead><tr><th>Jugador</th><th>PJ</th><th>PG</th><th>Mejor cierre</th><th>Media</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
    <div class="card hidden" id="histCard"><div id="histList"></div></div>
    <button class="btn btn-ghost" id="backFromHistory">Volver</button>
  </section>

</div>

<div class="toast" id="toast"></div>

/* ===================== MOTOR DE CIERRES (X01) ===================== */
// Construye todas las "dianas" posibles de un dardo, con etiqueta y si es doble.
const THROWS = (()=>{
  const a=[];
  for(let n=1;n<=20;n++){ a.push({lbl:String(n),val:n,dbl:false,bull:false,pref:n}); }      // simples
  for(let n=1;n<=20;n++){ a.push({lbl:"T"+n,val:n*3,dbl:false,bull:false,pref:n*3+1}); }      // triples
  for(let n=1;n<=20;n++){ a.push({lbl:"D"+n,val:n*2,dbl:true ,bull:false,pref:n*2}); }         // dobles
  a.push({lbl:"25",  val:25, dbl:false, bull:true,  pref:25}); // diana exterior
  a.push({lbl:"Bull",val:50, dbl:true , bull:true,  pref:51}); // diana interior (cuenta como doble)
  return a;
})();
const CLOSERS_DBL = THROWS.filter(t=>t.dbl);            // cierres válidos a doble
const CLOSERS_ANY = THROWS.slice();                     // cualquier diana cierra

// "Comodidad" de un doble para terminar: D20,D16,D8... y Bull son los preferidos.
function doubleScore(t){
  if(t.lbl==="Bull") return 90;
  const friendly={40:100,32:95,16:90,8:85,24:80,12:78,4:76,20:74,36:60,28:58,2:50};
  return friendly[t.val] || (50 - t.val); // dobles raros, menos preferidos
}
function routeScore(route){
  // menos dardos ya está garantizado por nivel; aquí priorizamos calidad
  let s=0;
  for(let i=0;i<route.length-1;i++) s += route[i].pref;      // primeros dardos altos
  s += doubleScore(route[route.length-1]);                   // buen doble final
  return s;
}
function fmtRoute(route){ return route.map(t=>t.lbl).join(" "); }

// Devuelve hasta `max` rutas de cierre para `score`, de longitud mínima posible.
function checkouts(score, doubleOut, max=3){
  if(score<=0 || score>170) return [];
  if(doubleOut && score===1) return [];
  const closers = doubleOut ? CLOSERS_DBL : CLOSERS_ANY;

  // nivel 1: un dardo
  let lvl1 = closers.filter(c=>c.val===score).map(c=>[c]);
  if(lvl1.length) return rank(lvl1,max);

  // nivel 2: dos dardos
  let lvl2=[];
  for(const c of closers){
    const rem = score - c.val;
    if(rem<=0) continue;
    for(const d of THROWS){ if(d.val===rem) lvl2.push([d,c]); }
  }
  if(lvl2.length) return rank(lvl2,max);

  // nivel 3: tres dardos
  let lvl3=[];
  for(const c of closers){
    const rem = score - c.val;
    if(rem<=0) continue;
    for(const d1 of THROWS){
      const r2 = rem - d1.val;
      if(r2<=0) continue;
      for(const d2 of THROWS){ if(d2.val===r2){ lvl3.push([d1,d2,c]); } }
    }
  }
  return rank(lvl3,max);
}
function rank(routes,max){
  const seen=new Set(); const uniq=[];
  routes.sort((a,b)=>routeScore(b)-routeScore(a));
  for(const r of routes){ const k=fmtRoute(r); if(!seen.has(k)){seen.add(k);uniq.push(r);} if(uniq.length>=max) break; }
  return uniq;
}

/* ===================== ESTADO ===================== */
let db=null, currentUser=null;
let selected=[];        // ids de jugadores en la partida
let mode=301, doubleOut=false;
let game=null;          // {mode,doubleOut,players:[{id,score,turns:[],totalDarts}],turn,startedAt,finished,winner}
let undoStack=[];       // snapshots para deshacer
let entryStr="";

/* ===================== FIREBASE / AUTH ===================== */
function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    firebase.auth().onAuthStateChanged(handleAuth);
  }catch(e){
    document.getElementById('loginErr').innerHTML =
      "⚠️ Falta pegar el firebaseConfig (mira el comentario en el código).";
  }
}
function handleAuth(user){
  if(user && WHITELIST.includes((user.email||"").toLowerCase())){
    currentUser=user;
    document.getElementById('whoBox').innerHTML =
      `<b>${user.displayName||user.email}</b><a href="#" id="logoutLink">Salir</a>`;
    document.getElementById('logoutLink').onclick=(e)=>{e.preventDefault();firebase.auth().signOut();};
    show('newGameScreen');
    listenGame();
  }else if(user){
    firebase.auth().signOut();
    document.getElementById('loginErr').textContent="Ese correo no está en la lista de la peña.";
    show('loginScreen');
  }else{
    currentUser=null;
    document.getElementById('whoBox').innerHTML="";
    show('loginScreen');
  }
}
document.getElementById('googleBtn').onclick=()=>{
  const prov=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(prov).catch(e=>{
    document.getElementById('loginErr').textContent="No se pudo iniciar sesión: "+e.message;
  });
};

/* Partida activa sincronizada en /dardos/partidaActual */
function listenGame(){
  if(!db) return;
  db.ref('dardos/partidaActual').on('value', snap=>{
    const g=snap.val();
    if(g && !g.finished){
      game=g; renderGame();
      if(getActiveScreen()!=='gameScreen' && getActiveScreen()!=='winScreen') show('gameScreen');
    }
  });
}
function saveGame(){ if(db && game) db.ref('dardos/partidaActual').set(game); }

/* ===================== UI helpers ===================== */
const screens=['loginScreen','newGameScreen','gameScreen','winScreen','historyScreen'];
function show(id){ screens.forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id)); }
function getActiveScreen(){ return screens.find(s=>!document.getElementById(s).classList.contains('hidden')); }
function toast(msg,good=false){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className='toast show'+(good?' good':''); setTimeout(()=>t.className='toast',1800);
}
function avatarHTML(p,cls){
  const src = (typeof AVATARS!=='undefined') ? AVATARS[p.name] : null;
  if(src) return `<img class="${cls}" src="${src}" style="object-fit:cover" alt="${p.name}">`;
  return `<div class="${cls}" style="background:${p.color}">${p.initial}</div>`;
}

/* ===================== NUEVA PARTIDA ===================== */
function renderPlayerSelect(){
  const grid=document.getElementById('playersGrid'); grid.innerHTML="";
  PLAYERS.forEach(p=>{
    const sel=selected.includes(p.id);
    const el=document.createElement('div');
    el.className='pchip'+(sel?' sel':'');
    el.innerHTML=avatarHTML(p,'avatar')+`<span class="pname">${p.name}</span><span class="check">✔</span>`;
    el.onclick=()=>{
      if(selected.includes(p.id)) selected=selected.filter(x=>x!==p.id);
      else selected.push(p.id);
      renderPlayerSelect();
    };
    grid.appendChild(el);
  });
}
document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.onclick=()=>{ mode=+b.dataset.mode; document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b)); };
});
document.getElementById('doubleOut').onchange=e=>doubleOut=e.target.checked;

document.getElementById('startBtn').onclick=()=>{
  if(selected.length<2){ toast("Elige al menos 2 jugadores"); return; }
  game={
    mode, doubleOut,
    players: selected.map(id=>({id, score:mode, turns:[], darts:0})),
    turn:0, startedAt:Date.now(), finished:false, winner:null
  };
  undoStack=[]; entryStr="";
  saveGame(); renderGame(); show('gameScreen');
};
document.getElementById('goHistoryBtn').onclick=()=>{ show('historyScreen'); renderStats(); };

/* ===================== JUEGO ===================== */
function activePlayer(){ return game.players[game.turn]; }

function renderGame(){
  // marcador
  const sb=document.getElementById('scoreboard'); sb.innerHTML="";
  game.players.forEach((pl,i)=>{
    const p=P[pl.id]; const active=(i===game.turn);
    const lastTurn = pl.turns.length? pl.turns[pl.turns.length-1] : null;
    const el=document.createElement('div');
    el.className='pscore'+(active?' active':'');
    el.innerHTML =
      avatarHTML(p,'avatar')+
      `<div class="info">
         <div class="nm">${p.name} ${active?'<span class="arrow">▸ tira</span>':''}</div>
         <div class="turnpts">${lastTurn!=null?('último: '+lastTurn):'—'} · ${pl.darts||0} dardos</div>
       </div>
       <div class="pts">${pl.score}</div>`;
    sb.appendChild(el);
  });

  // turno actual + entrada
  const ap=activePlayer();
  document.getElementById('turnName').textContent=P[ap.id].name;

  // cierres
  const box=document.getElementById('checkoutBox');
  const routes=checkouts(ap.score, game.doubleOut, 3);
  if(ap.score<=170 && routes.length){
    box.classList.remove('hidden');
    document.getElementById('coRemain').textContent=ap.score;
    const rc=document.getElementById('routes'); rc.innerHTML="";
    routes.forEach(r=>{
      const div=document.createElement('div'); div.className='route';
      r.forEach((t,idx)=>{
        const cls = t.lbl==='Bull'?'hit bull':(t.dbl?'hit dbl':'hit');
        div.innerHTML += `<span class="${cls}">${t.lbl}</span>`;
        if(idx<r.length-1) div.innerHTML += `<span class="arrow-s">→</span>`;
      });
      rc.appendChild(div);
    });
  }else{
    box.classList.remove('hidden');
    document.getElementById('coRemain').textContent=ap.score;
    document.getElementById('routes').innerHTML =
      `<div class="nocheck">${ap.score>170?'Sin cierre directo — deja un número cómodo (40, 32, 36…)':(game.doubleOut?'No cierra a doble este turno':'—')}</div>`;
  }

  renderEntry();
  updateUndoBtn();
}
function renderEntry(){
  const v=document.getElementById('entryVal');
  if(entryStr===""){ v.textContent="0"; v.className="ph"; }
  else { v.textContent=entryStr; v.className=""; }
}
function updateUndoBtn(){
  document.getElementById('undoBtn').style.opacity = undoStack.length? "1":".4";
}

// keypad
const keypad=document.getElementById('keypad');
["1","2","3","4","5","6","7","8","9","C","0","⌫"].forEach(k=>{
  const b=document.createElement('button'); b.className='key'+(k==="⌫"?' key-del':'')+(k==="C"?' key-del':'');
  b.textContent=k;
  b.onclick=()=>{
    if(k==="C"){ entryStr=""; }
    else if(k==="⌫"){ entryStr=entryStr.slice(0,-1); }
    else { if(entryStr.length<3){ const nx=entryStr+k; if(+nx<=180) entryStr=nx; else toast("Máximo 180"); } }
    renderEntry();
  };
  keypad.appendChild(b);
});
// quick buttons
const quick=document.getElementById('quickBtns');
[0,26,41,45,60,81,100,140,180].forEach(n=>{
  const b=document.createElement('button'); b.textContent=n;
  b.onclick=()=>{ entryStr=String(n); renderEntry(); };
  quick.appendChild(b);
});

document.getElementById('okBtn').onclick=()=>submitTurn();
function submitTurn(){
  const pts = entryStr===""?0:parseInt(entryStr,10);
  if(pts>180){ toast("Máximo 180 por turno"); return; }
  const ap=activePlayer();
  const remaining = ap.score - pts;

  // snapshot para deshacer
  undoStack.push(JSON.stringify({players:game.players, turn:game.turn}));
  if(undoStack.length>40) undoStack.shift();

  // BUST
  const bustZeroNoDouble = false; // con "total del turno" no verificamos el doble; lo cantáis vosotros
  if(remaining<0 || (game.doubleOut && remaining===1)){
    toast("¡Pasado! "+P[ap.id].name+" se queda en "+ap.score);
    ap.turns.push("BUST");
    ap.darts += 3;
    nextTurn(); saveGame(); renderGame(); entryStr=""; renderEntry();
    return;
  }

  ap.score = remaining;
  ap.turns.push(pts);
  ap.darts += 3;

  // VICTORIA
  if(remaining===0){
    game.finished=true; game.winner=ap.id; game.endedAt=Date.now();
    saveGame();
    finishGame(ap, pts);
    return;
  }

  nextTurn(); saveGame(); renderGame(); entryStr=""; renderEntry();
}
function nextTurn(){ game.turn=(game.turn+1)%game.players.length; }

document.getElementById('undoBtn').onclick=()=>{
  if(!undoStack.length){ toast("Nada que deshacer"); return; }
  const snap=JSON.parse(undoStack.pop());
  game.players=snap.players; game.turn=snap.turn;
  if(game.finished){ game.finished=false; game.winner=null; }
  entryStr=""; saveGame();
  show('gameScreen'); renderGame();
  toast("Turno deshecho", true);
};

document.getElementById('quitBtn').onclick=()=>{
  if(confirm("¿Abandonar la partida actual?")){
    if(db) db.ref('dardos/partidaActual').remove();
    game=null; undoStack=[]; show('newGameScreen'); renderPlayerSelect();
  }
};

/* ===================== FIN DE PARTIDA + STATS ===================== */
function finishGame(winnerPlayer, closingPts){
  const w=P[winnerPlayer.id];
  document.getElementById('winName').textContent=w.name;
  const avg = winnerPlayer.darts? Math.round((game.mode - winnerPlayer.score)/(winnerPlayer.darts/3)) : 0;
  document.getElementById('winStat').textContent =
    `${game.mode} · cierre de ${closingPts} · media ${avg}/turno`;
  show('winScreen');

  // guardar histórico + stats
  if(db){
    const rec={
      mode:game.mode, doubleOut:game.doubleOut, winner:winnerPlayer.id,
      players:game.players.map(p=>p.id), closing:closingPts,
      startedAt:game.startedAt, endedAt:Date.now()
    };
    db.ref('dardos/historico').push(rec);
    // stats por jugador
    game.players.forEach(pl=>{
      const ref=db.ref('dardos/stats/'+pl.id);
      ref.transaction(s=>{
        s=s||{played:0,won:0,bestCheckout:0,sumPoints:0,sumTurns:0};
        const turns=pl.turns.filter(t=>t!=="BUST").length;
        const pointsScored=game.mode-pl.score;
        s.played+=1;
        s.sumPoints+=pointsScored;
        s.sumTurns+=Math.max(turns,1);
        if(pl.id===winnerPlayer.id){
          s.won+=1;
          if(closingPts>(s.bestCheckout||0)) s.bestCheckout=closingPts;
        }
        return s;
      });
    });
    db.ref('dardos/partidaActual').remove();
  }
}
document.getElementById('rematchBtn').onclick=()=>{
  const ids=game?game.players.map(p=>p.id):selected;
  selected=ids.slice();
  game={ mode, doubleOut, players:ids.map(id=>({id,score:mode,turns:[],darts:0})),
         turn:0, startedAt:Date.now(), finished:false, winner:null };
  undoStack=[]; entryStr=""; saveGame(); renderGame(); show('gameScreen');
};
document.getElementById('newFromWinBtn').onclick=()=>{ show('newGameScreen'); renderPlayerSelect(); };

/* ===================== HISTÓRICO / STATS ===================== */
document.getElementById('tabStats').onclick=()=>{ switchTab('stats'); };
document.getElementById('tabHist').onclick=()=>{ switchTab('hist'); };
function switchTab(t){
  document.getElementById('tabStats').classList.toggle('on',t==='stats');
  document.getElementById('tabHist').classList.toggle('on',t==='hist');
  document.getElementById('statsCard').classList.toggle('hidden',t!=='stats');
  document.getElementById('histCard').classList.toggle('hidden',t!=='hist');
  if(t==='stats') renderStats(); else renderHistory();
}
function renderStats(){
  const body=document.getElementById('statsBody'); body.innerHTML="";
  if(!db){ body.innerHTML='<tr><td colspan="5" class="empty">Sin conexión</td></tr>'; return; }
  db.ref('dardos/stats').once('value',snap=>{
    const s=snap.val()||{};
    const rows=PLAYERS.map(p=>({p, st:s[p.id]||{played:0,won:0,bestCheckout:0,sumPoints:0,sumTurns:0}}))
                      .filter(r=>r.st.played>0)
                      .sort((a,b)=> b.st.won-a.st.won || b.st.bestCheckout-a.st.bestCheckout);
    if(!rows.length){ body.innerHTML='<tr><td colspan="5" class="empty">Aún no hay partidas jugadas 🎯</td></tr>'; return; }
    rows.forEach(({p,st})=>{
      const avg = st.sumTurns? Math.round(st.sumPoints/st.sumTurns):0;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><span class="miniav" style="background:${p.color}">${p.initial}</span>${p.name}</td>
        <td>${st.played}</td><td>${st.won}</td><td>${st.bestCheckout||'—'}</td><td>${avg}</td>`;
      body.appendChild(tr);
    });
  });
}
function renderHistory(){
  const list=document.getElementById('histList'); list.innerHTML="";
  if(!db){ list.innerHTML='<div class="empty">Sin conexión</div>'; return; }
  db.ref('dardos/historico').limitToLast(30).once('value',snap=>{
    const v=snap.val();
    if(!v){ list.innerHTML='<div class="empty">Sin partidas todavía 🎯</div>'; return; }
    const arr=Object.values(v).sort((a,b)=>b.endedAt-a.endedAt);
    arr.forEach(r=>{
      const w=P[r.winner]; const d=new Date(r.endedAt);
      const others=r.players.filter(id=>id!==r.winner).map(id=>P[id].name).join(", ");
      const el=document.createElement('div'); el.className='hist-item';
      el.innerHTML=`<span class="mode-tag">${r.mode}</span>
        <span><span class="win">👑 ${w.name}</span> vs ${others}${r.closing?` · cierre ${r.closing}`:''}</span>
        <span class="date">${d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}</span>`;
      list.appendChild(el);
    });
  });
}
document.getElementById('backFromHistory').onclick=()=>{ show(game&&!game.finished?'gameScreen':'newGameScreen'); if(!game)renderPlayerSelect(); };

/* ===================== ARRANQUE ===================== */
renderPlayerSelect();
initFirebase();
</script>
